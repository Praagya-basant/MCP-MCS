<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the saved theme before first paint, so there's no flash
         of the wrong theme while React (and ThemeProvider's effect)
         mounts — same localStorage key ThemeContext reads/writes. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('basant-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA install (Android reads the manifest, injected automatically by
         vite-plugin-pwa at build time — see vite.config.js). iOS needs
         these specific tags regardless, since Safari doesn't read the
         web manifest for "Add to Home Screen" the same way. -->
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BASANT" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <title>BASANT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
